name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL ZIP project Flutter'
        required: true
      tag:
        description: 'Tag build'
        required: true
      build_type:
        description: 'debug atau release'
        required: true
        default: 'release'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Download ZIP Project
        run: |
          echo "📥 Download dari: ${{ github.event.inputs.zip_url }}"
          curl -L -f --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -o project.zip "${{ github.event.inputs.zip_url }}" || {
              echo "❌ Gagal download tanpa auth, coba tanpa header..."
              curl -L -f --retry 3 -o project.zip "${{ github.event.inputs.zip_url }}"
            }
          echo "✅ Size:"
          ls -lh project.zip
          file project.zip

      - name: Verify ZIP
        run: |
          if ! unzip -t project.zip; then
            echo "❌ ZIP korup! Coba download ulang..."
            exit 1
          fi
          echo "✅ ZIP valid"

      - name: Extract ZIP
        run: |
          mkdir -p source
          unzip -o project.zip -d source
          echo "✅ Extract selesai"
          ls -la source/

      - name: Find Flutter Project Root
        id: find_flutter
        run: |
          PUBSPEC=$(find source -name "pubspec.yaml" -not -path "*/build/*" -not -path "*/.dart_tool/*" | head -1)
          if [ -z "$PUBSPEC" ]; then
            echo "❌ pubspec.yaml tidak ditemukan!"
            find source -maxdepth 3 -type f | head -30
            exit 1
          fi
          FLUTTER_DIR=$(dirname "$PUBSPEC")
          echo "✅ Flutter dir: $FLUTTER_DIR"
          echo "FLUTTER_DIR=$FLUTTER_DIR" >> $GITHUB_ENV

      - name: Flutter Pub Get
        run: |
          cd "$FLUTTER_DIR"
          flutter pub get

      - name: Flutter Build APK
        run: |
          cd "$FLUTTER_DIR"
          flutter build apk --${{ github.event.inputs.build_type }}

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.tag }}
          path: ${{ env.FLUTTER_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Show Error Log
        if: failure()
        run: |
          echo "================================"
          echo "[RESULT_ANALYZE]"
          echo "Step yang gagal: cek langkah di atas"
          echo "File ZIP size:"
          ls -lh project.zip 2>/dev/null || echo "project.zip tidak ada"
          echo "File type:"
          file project.zip 2>/dev/null
          echo "================================"
          echo "[END_RESULT_ANALYZE]"
